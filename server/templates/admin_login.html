<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Helen's Barber Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #09090b;
      color: #f7f7f5;
      font-family: 'DM Sans', sans-serif;
    }
    .container {
      width: min(420px, 90vw);
      background: #111116;
      border: 1px solid rgba(220,38,38,.35);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,.45);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #f87171;
      font: 700 11px 'Barlow Condensed';
      letter-spacing: 2.4px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 24px;
      font: 800 52px/0.9 'Barlow Condensed';
      letter-spacing: -1.5px;
    }
    h1 em { color: #dc2626; font-style: normal; }
    label {
      display: block;
      margin-bottom: 16px;
      font-size: 13px;
      color: #cbd5e1;
    }
    input, button {
      width: 100%;
      border-radius: 10px;
      padding: 14px 15px;
      font-size: 15px;
    }
    input {
      margin-top: 8px;
      border: 1px solid rgba(148,163,184,.3);
      background: #17171d;
      color: #fff;
      outline: none;
    }
    input:focus {
      border-color: rgba(239,68,68,.8);
      box-shadow: 0 0 0 3px rgba(239,68,68,.15);
    }
    button {
      margin-top: 10px;
      border: 0;
      background: linear-gradient(135deg, #dc2626, #ef4444);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .error {
      margin-top: 16px;
      color: #fca5a5;
      min-height: 20px;
      font-size: 14px;
    }
    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="eyebrow">Shop Owner Access</p>
    <h1>ADMIN <em>LOGIN</em></h1>

    <form method="POST">
      <label>
        Username
        <input type="text" name="username" value="raheem shah" required>
      </label>
      <label>
        Password
        <input type="password" name="password" required>
      </label>
      <button type="submit">Login to Dashboard</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <a class="back-link" href="{{ url_for('home') }}">← Back to website</a>
  </div>
</body>
</html>
